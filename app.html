<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>MainsAgents</title>
  <link rel="icon" type="image/png" href="/images/brand/mainsagents-favicon-64.png" />
  <link rel="apple-touch-icon" href="/images/brand/mainsagents-favicon-64.png" />
  <script>try{document.documentElement.dataset.appearance=localStorage.getItem('mainsagents-appearance')==='dark'?'dark':'light'}catch{}</script>
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="mainsagents.css" />
  <link rel="stylesheet" href="src/styles/workspace.css" />
  <link rel="stylesheet" href="src/styles/content.css" />
  <link rel="stylesheet" href="src/styles/agents.css" />
  <link rel="stylesheet" href="src/styles/canvas-widgets.css" />
  <link rel="stylesheet" href="src/styles/usability.css" />
  <link rel="stylesheet" href="src/styles/studio.css" />
  <link rel="stylesheet" href="src/styles/studio-pages.css" />
  <link rel="stylesheet" href="src/styles/editorial-chat.css" />
  <link rel="stylesheet" href="src/styles/agent-collaboration.css" />
  <style id="splash-style">
    #splash{pointer-events:none;--sp-bg:#f6f6f7;--sp-fg:#121317;--sp-eye:#f6f6f7;--sp-muted:#62656e;--sp-track:#e6e6e9;--sp-accent:#3557f5;position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:var(--sp-bg);color:var(--sp-fg);font-family:'Geist',system-ui,sans-serif;transition:opacity .32s ease,visibility .32s}
    :root[data-appearance=dark] #splash{--sp-bg:#0c0d10;--sp-fg:#f3f4f6;--sp-eye:#0c0d10;--sp-muted:#8d909b;--sp-track:#1d1f25;--sp-accent:#7d93ff}
    #splash.done{opacity:0;visibility:hidden;pointer-events:none}
    #splash .sp-row{display:flex;align-items:center}
    #splash .sp-mark{position:relative;width:128px;height:128px;flex-shrink:0}
    #splash .sp-ring{position:absolute;inset:-18%;border-radius:50%;border:1.5px solid var(--sp-accent);opacity:0;animation:ma-ring 1.1s ease-out both}
    #splash svg{width:100%;height:100%;overflow:visible;display:block}
    #splash .fb{transform-box:fill-box;transform-origin:center}
    #splash .sp-body{transform-box:fill-box;transform-origin:50% 100%;animation:ma-body .6s cubic-bezier(.2,.8,.2,1) both}
    #splash .sp-baton{transform-box:view-box;transform-origin:54px 39px;animation:ma-baton .8s cubic-bezier(.2,.8,.2,1) .72s both}
    #splash .sp-word{overflow:hidden;white-space:nowrap;animation:ma-word .7s cubic-bezier(.2,.8,.2,1) 1.25s both}
    #splash .sp-word span{display:block;padding-left:22px;font-size:52px;letter-spacing:-.035em;line-height:1}
    #splash .sp-word b{font-weight:600}#splash .sp-word i{font-style:normal;font-weight:400;color:var(--sp-muted)}
    #splash .sp-foot{display:flex;flex-direction:column;align-items:center;gap:12px;animation:ma-fade .5s ease-out 1.6s both}
    #splash .sp-track{width:140px;height:3px;border-radius:99px;background:var(--sp-track);overflow:hidden}
    #splash .sp-bar{width:100%;height:100%;border-radius:99px;background:var(--sp-accent);transform-origin:0 50%;animation:ma-bar .9s cubic-bezier(.4,0,.2,1) 1.7s both}
    #splash .sp-foot p{margin:0;font-size:13px;color:var(--sp-muted)}
    @keyframes ma-body{0%{opacity:0;transform:translateY(10px) scale(.55)}60%{opacity:1;transform:translateY(-2px) scale(1.05)}100%{opacity:1;transform:none}}
    @keyframes ma-pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
    @keyframes ma-eye{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
    @keyframes ma-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
    @keyframes ma-baton{0%{opacity:0;transform:rotate(-80deg)}50%{opacity:1;transform:rotate(14deg)}72%{transform:rotate(-7deg)}88%{transform:rotate(3deg)}100%{opacity:1;transform:rotate(0)}}
    @keyframes ma-ring{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.9)}}
    @keyframes ma-spark{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
    @keyframes ma-word{0%{max-width:0;opacity:0}100%{max-width:340px;opacity:1}}
    @keyframes ma-fade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
    @keyframes ma-bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){#splash *{animation-duration:1ms!important;animation-delay:0ms!important}}
    :root[data-reduced-motion=true] #splash *{animation-duration:1ms!important;animation-delay:0ms!important}
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="sp-row">
      <div class="sp-mark">
        <div class="sp-ring" style="animation-delay:.15s"></div><div class="sp-ring" style="animation-delay:1.15s"></div>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g class="sp-body"><path d="M14 30 A18 18 0 0 1 50 30 V46 Q50 54 41 57 L32 49 L23 57 Q14 54 14 46 Z" fill="var(--sp-fg)"/></g>
          <ellipse class="fb" cx="26" cy="29" rx="2.6" ry="3.6" fill="var(--sp-eye)" style="animation:ma-eye .25s cubic-bezier(.2,.8,.2,1) .45s both,ma-blink .2s ease-in-out 1.95s"/>
          <ellipse class="fb" cx="38" cy="29" rx="2.6" ry="3.6" fill="var(--sp-eye)" style="animation:ma-eye .25s cubic-bezier(.2,.8,.2,1) .5s both,ma-blink .2s ease-in-out 1.95s"/>
          <path class="fb" d="M28.5 39 L32 41 L28.5 43 Z M35.5 39 L32 41 L35.5 43 Z" fill="var(--sp-eye)" style="animation:ma-pop .35s cubic-bezier(.2,.8,.2,1) .62s both"/>
          <g class="sp-baton">
            <path d="M55 37 L61 24" fill="none" stroke="var(--sp-fg)" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="54" cy="39" r="3.4" fill="var(--sp-fg)"/>
            <circle class="fb" cx="61" cy="24" r="2.2" fill="var(--sp-accent)" style="animation:ma-spark .6s ease-out 1.1s both"/>
          </g>
        </svg>
      </div>
      <div class="sp-word"><span><b>Mains</b><i>Agents</i></span></div>
    </div>
    <div class="sp-foot"><div class="sp-track"><div class="sp-bar"></div></div><p id="splash-label">Abrindo seus dados salvos…</p></div>
  </div>
  <script>
    (function(){
      var splash=document.getElementById('splash'),start=performance.now(),hidden=false;
      try{if(!navigator.language.startsWith('pt'))document.getElementById('splash-label').textContent='Opening your saved data…'}catch(e){}
      var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      // Hold the 2.6 s opening only on first paint; never block a workspace that is ready sooner than that.
      window.mainsAgentsHideSplash=function(){
        if(hidden||!splash)return;hidden=true;
        var wait=reduced?0:Math.max(0,2600-(performance.now()-start));
        setTimeout(function(){splash.classList.add('done');splash.removeAttribute('role');setTimeout(function(){splash.remove()},400)},wait);
      };
      // Safety net: never leave the splash over the app.
      setTimeout(function(){window.mainsAgentsHideSplash()},12000);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
